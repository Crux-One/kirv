[package]
name = "kirv"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
description = "A modern macOS CPU throttling utility for process groups"
license = "MIT"
repository = "https://github.com/Crux-One/kirv"
readme = "README.md"
keywords = ["cpu", "throttle", "macos", "process", "cli"]
categories = ["command-line-utilities"]
exclude = [".github/", "assets/"]

[dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }
signal-hook = "0.4.4"
sysinfo = "0.39.3"

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
strip = true
lto = true
